The 40 level includes words from Alan's 3esl list found in version 4.0
of his 12dicts package.  Like his other stuff the 3esl list is also in the
public domain.

The 50 level includes Brian's frequency class 1, words words appearing
in at least 5 of 12 of the dictionaries as indicated in the 12Dicts
package, and uppercase words in at least 4 of the previous 12
dictionaries.  A decent number of proper names is also included: The
top 1000 male, female, and Last names from the 1990 Census report; a
list of names sent to me by Alan Beale; and a few names that I added
myself.  Finally a small list of abbreviations not commonly found in
other word lists is included.

The name files form the Census report is a government document which I
don't think can be copyrighted.

The file special-jargon.50 uses common.lst and word.lst from the
"Unofficial Jargon File Word Lists" which is derived from "The Jargon
File".  All of which is in the Public Domain.  This file also contain
a few extra UNIX terms which are found in the file "unix-terms" in the
special/ directory.

The 55 level includes words from Alan's 2of4brif list found in version
4.0 of his 12dicts package.  Like his other stuff the 2of4brif is also
in the public domain.

The 60 level includes all words appearing in at least 2 of the 12
dictionaries as indicated by the 12Dicts package.

The 70 level includes Brian's frequency class 0 and the 74,550 common
dictionary words from the MWords package.  The common dictionary words,
like those from the 12Dicts package, have had all likely inflections
added.  The 70 level also included the 5desk list from version 4.0 of
the 12Dics package which is the public domain.

The 80 level includes the ENABLE word list, all the lists in the
ENABLE supplement package (except for ABLE), the "UK Advanced Cryptics
Dictionary" (UKACD), the list of signature words in from YAWL package,
and the 10,196 places list from the MWords package.

/* TTS adapter: browser SpeechSynthesis or native Android TextToSpeech bridge.
   The Android bridge is available only inside the packaged NovelWeaver WebView. */
(function(){'use strict';
 let active=null, sequence=0;
 const native=()=>window.NovelWeaverNative&&typeof window.NovelWeaverNative.ttsSpeak==='function';
 const browser=()=>typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance==='function';
 function voices(){if(native()){try{return JSON.parse(window.NovelWeaverNative.ttsVoices()||'[]')}catch(e){return []}}
 if(!browser())return [];
 return speechSynthesis.getVoices().map(v=>({id:v.voiceURI,name:v.name,lang:v.lang}));}
 function stop(){++sequence;active=null;if(native())window.NovelWeaverNative.ttsStop();else if(browser())speechSynthesis.cancel();}
 function speak(text,options){stop();const key=sequence;active={key,onDone:options.onDone,onError:options.onError,options,text};
 if(native()){window.NovelWeaverNative.ttsSpeak(text,options.voice||'',options.rate||1,String(key));return;}
 if(!browser()){active.onError?.('No TTS engine available');return;}
 const u=new SpeechSynthesisUtterance(text);u.rate=options.rate||1;u.lang='en-US';const voice=speechSynthesis.getVoices().find(v=>v.voiceURI===options.voice);
 if(voice)u.voice=voice;
 u.onend=()=>{if(active?.key===key){const cb=active.onDone;active=null;cb?.();}};
 u.onerror=e=>{if(active?.key===key){const cb=active.onError;active=null;cb?.(e.error||'Playback failed')}};
 speechSynthesis.speak(u);
 }
 function pause(){if(native())window.NovelWeaverNative.ttsPause();else if(browser())speechSynthesis.pause();}
 function resume(){if(native()){
    if(active)window.NovelWeaverNative.ttsSpeak(active.text,active.options.voice||'',active.options.rate||1,String(active.key));
 }else if(browser())speechSynthesis.resume();}
 window.NWTTS={available:()=>!!(native()||browser()),voices,stop,speak,pause,resume,
 nativeComplete:(key,error)=>{const a=active;if(!a||String(a.key)!==String(key))return;active=null;if(error)a.onError?.(error);else a.onDone?.()}};
 if(browser())speechSynthesis.addEventListener('voiceschanged',()=>window.dispatchEvent(new Event('nw-voices')));
})();

/* NovelWeaver Mobile — offline, dependency-free web edition. Data keys intentionally

(()=>{'use strict';
const $=(sel,root=document)=>root.querySelector(sel), $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID?.()??'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
const now=()=>new Date().toISOString();
const wc=s=>(String(s??'').match(/[\p{L}\p{N}]+(?:[’'-][\p{L}\p{N}]+)*/gu)||[]).length;
const short=(s,n=155)=>s.length>n?s.slice(0,n-1)+'…':s;
const P=()=>({Id:id(),Title:'Untitled Series',Books:[],Chapters:[],Threads:[],Reviews:[],History:[]});
const mkBook=(title='New Book')=>({Id:id(),Title:title});
const mkChapter=(bookId,title='New Chapter')=>({Id:id(),BookId:bookId,Title:title,Paragraphs:[mkPara()]});
const mkPara=(text='',threadIds=[])=>({Id:id(),Text:text,ThreadIds:[...threadIds]});
function defaultProject(){const p=P(),b=mkBook('Book One');p.Books.push(b);p.Chapters.push(mkChapter(b.Id,'Chapter 1'));return p}
function cleanProject(raw){if(!raw||typeof raw!=='object'||!Array.isArray(raw.Books)||!Array.isArray(raw.Chapters)||!Array.isArray(raw.Threads))throw Error('Not a NovelWeaver project (.novel.json).');
 const p={Id:String(raw.Id||id()),Title:String(raw.Title||'Untitled Series'),Books:[],Chapters:[],Threads:[],Reviews:[],History:[]};
 p.Books=raw.Books.map(b=>({Id:String(b.Id||id()),Title:String(b.Title||'Untitled Book')}));
 p.Chapters=raw.Chapters.map(c=>({Id:String(c.Id||id()),BookId:String(c.BookId||''),Title:String(c.Title||'Chapter'),Paragraphs:(Array.isArray(c.Paragraphs)?c.Paragraphs:[]).map(q=>({Id:String(q.Id||id()),Text:String(q.Text||''),ThreadIds:Array.isArray(q.ThreadIds)?q.ThreadIds.map(String):[]}))}));
 p.Threads=raw.Threads.map(t=>({Id:String(t.Id||id()),Name:String(t.Name||'Thread'),Notes:String(t.Notes||'')}));
 p.Reviews=(Array.isArray(raw.Reviews)?raw.Reviews:[]).map(r=>({Id:String(r.Id||id()),ThreadId:String(r.ThreadId||''),SourceParagraphId:String(r.SourceParagraphId||''),TargetParagraphId:String(r.TargetParagraphId||''),ChangeId:String(r.ChangeId||''),TriggeredAtUtc:r.TriggeredAtUtc||now(),ResolvedAtUtc:r.ResolvedAtUtc||null}));
 p.History=(Array.isArray(raw.History)?raw.History:[]).map(c=>({Id:String(c.Id||id()),ParagraphId:String(c.ParagraphId||''),ChapterId:String(c.ChapterId||''),Before:String(c.Before||''),After:String(c.After||''),ChangedAtUtc:c.ChangedAtUtc||now()}));
 return p}
function locate(pid){for(const c of S.project.Chapters){const i=c.Paragraphs.findIndex(p=>p.Id===pid);if(i!==-1)return{book:S.project.Books.find(b=>b.Id===c.BookId),chapter:c,paragraph:c.Paragraphs[i],index:i}}return null}
const bookById=id=>S.project.Books.find(b=>b.Id===id), chapterById=id=>S.project.Chapters.find(c=>c.Id===id), threadById=id=>S.project.Threads.find(t=>t.Id===id);
const pending=pid=>S.project.Reviews.filter(r=>r.TargetParagraphId===pid&&!r.ResolvedAtUtc);
const pendingAll=()=>S.project.Reviews.filter(r=>!r.ResolvedAtUtc&&locate(r.TargetParagraphId)&&threadById(r.ThreadId));
const linked=tid=>S.project.Chapters.flatMap(ch=>ch.Paragraphs.filter(p=>p.ThreadIds.includes(tid)).map(p=>({chapter:ch,paragraph:p,book:bookById(ch.BookId)})));
const label=pid=>{const loc=locate(pid);return loc?`${loc.book?.Title||'Book'} / ${loc.chapter.Title}`:'Deleted paragraph'};
function swapChapter(){const c=chapterById(S.chapterId);if(c){S.bookId=c.BookId;return}const b=bookById(S.bookId)||S.project.Books[0];S.bookId=b?.Id;S.chapterId=S.project.Chapters.find(c=>c.BookId===S.bookId)?.Id||null}
const S={project:defaultProject(),bookId:null,chapterId:null,readChapterId:null,paraId:null,threadId:null,view:'write',reader:{mode:'plain',theme:'paper',fontSize:19,font:'serif',page:0,pages:1,positions:{}},query:'',customWords:new Set(),ignoredWords:new Set(),lexicon:null,editSession:new Map(),sidebarOpen:false,dirty:false,listen:{scope:'chapter',rate:1,voice:'',pid:null,playing:false,paused:false,queue:[],index:0,token:0,rules:[]}};
window.NovelWeaverCore={cleanProject,defaultProject,mkPara};
window.addEventListener('nw-voices',()=>{const sel=$('#listen-voice');if(sel){const keep=S.listen.voice;sel.innerHTML=listenVisibleVoices();sel.value=keep;}});
// IndexedDB retains large manuscripts without typical localStorage size limits.
let db=null,persistence='indexeddb',saveTimer=null,saveBusy=false,saveAgain=false,lastSaved='';
const DB='NovelWeaverMobileV1';
function initDb(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('IndexedDB unavailable'));const rq=indexedDB.open(DB,1);rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains('records'))rq.result.createObjectStore('records')};rq.onsuccess=()=>resolve(rq.result);rq.onerror=()=>reject(rq.error)})}
function dbGet(key){return new Promise((resolve,reject)=>{const r=db.transaction('records','readonly').objectStore('records').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbPut(entries){return new Promise((resolve,reject)=>{const t=db.transaction('records','readwrite'),st=t.objectStore('records');for(const[k,v]of Object.entries(entries))st.put(v,k);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
async function loadLocal(){try{db=await initDb();const p=await dbGet('project'),terms=await dbGet('customWords');if(p)S.project=cleanProject(p);if(Array.isArray(terms))S.customWords=new Set(terms.map(normalizeWord).filter(Boolean));}catch(e){console.warn('IndexedDB unavailable:',e);persistence='localStorage';try{const p=localStorage.getItem('novelweaver.project');if(p)S.project=cleanProject(JSON.parse(p));S.customWords=new Set(JSON.parse(localStorage.getItem('novelweaver.dictionary')||'[]'))}catch(e2){console.warn(e2);persistence='memory';toast('Storage unavailable. Export backups often.')}}swapChapter()}
function scheduleSave(){S.dirty=true;$('#save-status').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(saveLocal,550)}
async function saveLocal(){clearTimeout(saveTimer);if(saveBusy){saveAgain=true;return}saveBusy=true;const savedCopy=JSON.stringify(S.project),wordsCopy=[...S.customWords];try{if(persistence==='indexeddb')await dbPut({project:JSON.parse(savedCopy),customWords:wordsCopy});else if(persistence==='localStorage'){localStorage.setItem('novelweaver.project',savedCopy);localStorage.setItem('novelweaver.dictionary',JSON.stringify(wordsCopy))}else throw Error('No persistent storage');lastSaved=now();S.dirty=false;$('#save-status').textContent='Saved locally';driveShowStatus();}catch(e){console.error(e);S.dirty=true;$('#save-status').textContent='Backup needed';toast('Save failed: export a JSON backup!')}finally{saveBusy=false;if(saveAgain){saveAgain=false;scheduleSave()}}}
function changed(){scheduleSave();updateBadges();driveQueueAutoSave()}
function safeName(s){return String(s).replace(/[^\p{L}\p{N}._ -]/gu,'').trim().replace(/\s+/g,'-').slice(0,85)||'NovelWeaver'}
function download(filename,data,mime){const blob=data instanceof Blob?data:new Blob([data],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000)}
function backup(){flushAllEdits();download(safeName(S.project.Title)+'.novel.json',JSON.stringify(S.project,null,2),'application/json');toast('Project backup downloaded')}
// Matching C# semantics: one unresolved target+thread alert, latest source wins.
function editParagraph(pid,newText,sessionKey=null){const f=locate(pid);if(!f||f.paragraph.Text===newText)return false;const before=f.paragraph.Text;f.paragraph.Text=newText;
 let rec=sessionKey&&S.editSession.get(pid)?.record;
 if(!rec){rec={Id:id(),ParagraphId:pid,ChapterId:f.chapter.Id,Before:before,After:newText,ChangedAtUtc:now()};S.project.History.push(rec);if(sessionKey)S.editSession.set(pid,{record:rec})}else{rec.After=newText;rec.ChangedAtUtc=now()}
 for(const tid of new Set(f.paragraph.ThreadIds)){for(const l of linked(tid)){if(l.paragraph.Id===pid)continue;let alert=S.project.Reviews.find(r=>r.TargetParagraphId===l.paragraph.Id&&r.ThreadId===tid&&!r.ResolvedAtUtc);if(!alert){alert={Id:id(),ThreadId:tid,SourceParagraphId:pid,TargetParagraphId:l.paragraph.Id,ChangeId:rec.Id,TriggeredAtUtc:now(),ResolvedAtUtc:null};S.project.Reviews.push(alert)}else{alert.SourceParagraphId=pid;alert.ChangeId=rec.Id;alert.TriggeredAtUtc=now()}}}
 changed();return true}

function ebookRefresh(){
 if(S.view!=='read'||S.reader.mode!=='ebook')return;
 const viewport=$('#ebook-viewport'),flow=$('#ebook-column-flow');if(!viewport||!flow)return;
 const width=viewport.clientWidth;
 if(width<30)return;
 const gap=26;
 flow.style.columnWidth=width+'px';
 flow.style.columnGap=gap+'px';
 // Reading the measured width forces columns to be laid out before counting.
 const pages=Math.max(1,Math.ceil((flow.scrollWidth+gap-2)/(width+gap)));
 S.reader.pages=pages;
 if(ebookReflowFraction!==null){
  S.reader.page=Math.round(Math.max(0,Math.min(1,ebookReflowFraction))*(pages-1));
  ebookReflowFraction=null;
 }
 S.reader.page=Math.max(0,Math.min(pages-1,S.reader.page));
 ebookShowPage();
}

function showHelp(){modal('Offline use & keyboard tips',`<p class="item-sub"><b>Android:</b> To install as an offline app, open the hosted site once over HTTPS, then choose your browser menu → Add to Home screen / Install app. After the first successful load, the app runs offline. Opening the HTML file directly also works in many browsers, but local file storage may not persist reliably.</p><p class="item-sub"><b>Important:</b> Export .novel.json backups regularly. After the first Save to Drive, linked projects sync automatically while Google is connected and this app is open. Offline edits remain local until reconnected; later uploads overwrite previous Drive content.</p><p class="item-sub"><b>Writing:</b> Enter creates a new paragraph; Shift+Enter inserts a line break. Backspace at the start merges with the previous paragraph. Ctrl+S downloads a portable project backup.</p><p class="item-sub"><b>Links:</b> Tap “⌁ Link” above a paragraph. Edit a linked paragraph and check the Review tab for other related passages. Each paragraph keeps its C# GUID.</p><p class="item-sub"><b>Spelling:</b> Tools → Proofread compares words with the bundled offline English word list and your custom entries. Browser-native spellcheck may still underline custom terms independently.</p><p class="item-sub"><b>Library menu:</b> Add book creates a blank book. Import book adds manuscripts or .novel.json books. Remove beside a book removes that book and its chapters after confirmation.</p><p class="item-sub"><b>Import books:</b> Tools &amp; backup → Import books into library adds all books in selected .novel.json files while keeping your existing books. Chapters, thread tags, reviews and history are retained. You can select multiple files. Open project replaces the workspace instead.</p><p class="item-sub"><b>Word import:</b> .docx formatting is simplified to paragraphs; preserve originals. Exported .docx has basic manuscript formatting. Project JSON is the lossless interchange format.</p>`,[{t $('#open-project-input').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>60_000_000)throw Error('Project exceeds 60 MB import limit');const p=cleanProject(JSON.parse(await f.text()));confirmAction('Open project',`Replace the currently open workspace with “${p.Title}”? Export a backup first if needed.`,()=>{listenStop();S.project=p;driveClearLink();S.bookId=null;S.chapterId=null;S.threadId=null;S.view='write';swapChapter();changed();render();toast('Project opened')})}catch(ex){modal('Could not open file',`<p class="item-sub">${h(ex.message)}</p>`)}finally{e.target.value=''}});
$('#import-book-input').addEventListener('change',async e=>{const files=[...e.target.files];for(const file of files)await importBook(file)});
document.addEventListener('change',async e=>{if(e.target.id==='thread-picker-select'){S.threadId=e.target.value;const details=$('#thread-overview');if(details)details.innerHTML=threadDetail(threadById(S.threadId));return}if(e.target.id==='listen-scope'){listenStop();S.listen.scope=e.target.value==='book'?'book':'chapter';S.listen.pid=null;listenSave();render();return}if(e.target.id==='listen-chapter'){listenStop();S.chapterId=e.target.value;S.listen.pid=S.project.Chapters.find(c=>c.Id===S.chapterId)?.Paragraphs.find(p=>p.Text.trim())?.Id||null;render();return}if(e.target.id==='listen-voice'){S.listen.voice=e.target.value;listenSave();if(S.listen.playing){listenStop();listenPlay()}return}if(e.target.id==='reader-book'){flushAllEdits();S.bookId=e.target.value;S.chapterId=S.project.Chapters.find(c=>c.BookId===S.bookId)?.Id||null;S.readChapterId=null;S.reader.page=0;render();return}if(e.target.id==='reader-chapter'){S.readChapterId=e.target.value||null;S.reader.page=0;readerRemember();render();$('#main').scrollTo?.(0,0);window.scrollTo(0,0);return}if(e.target.id==='ebook-theme'){S.reader.theme=e.target.value;readerSave();render();return}if(e.target.id==='ebook-font'||e.target.id==='reader-font-plain'){S.reader.font=['serif','sans','dyslexic'].includes(e.target.value)?e.target.value:'serif';S.reader.page=0;readerSave();render();return}if(e.target.id==='dictionary-input'){const f=e.target.files?.[0];if(!f)return;for(const w of (await f.text()).split(/\r?\n/))if(validWord(normalizeWord(w)))S.customWords.add(normalizeWord(w));changed();dictionary();toast('Dictionary imported')}});
window.addEventListener('resize',()=>{clearTimeout(ebookResizeTimer);ebookResizeTimer=setTimeout(ebookRefresh,140)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.documentElement.classList.contains('ebook-fallback-active')){e.preventDefault();ebookExitFullscreen();return}if(S.view!=='read'||S.reader.mode!=='ebook'||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('button,input,textarea,select,[contenteditable=true]'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();ebookMove(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();ebookMove(-1)}});
let ebookTouch=null;
document.addEventListener('touchstart',e=>{if(S.view!=='read'||S.reader.mode!=='ebook'||!e.target.closest('#ebook-viewport'))return;const t=e.touches[0];ebookTouch={x:t.clientX,y:t.clientY}},{passive:true});
document.addEventListener('touchend',e=>{if(!ebookTouch||S.view!=='read'||S.reader.mode!=='ebook')return;const t=e.changedTouches[0],dx=t.clientX-ebookTouch.x,dy=t.clientY-ebookTouch.y;ebookTouch=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)ebookMove(dx<0?1:-1)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){flushAllEdits();if(S.dirty)saveLocal()}});
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('change',e=>{if(e.target.id==='drive-autosync'){
 driveState.auto.enabled=e.target.checked;
 try{localStorage.setItem('novelweaver.drive.auto.v1',String(driveState.auto.enabled))}catch(err){console.warn(err)}
 if(driveState.auto.enabled)driveScheduleAuto(500);else driveClearAutoTimers();driveShowStatus();toast(driveState.auto.enabled?'Google Drive auto-sync enabled':'Google Drive auto-sync paused');
 }});
window.addEventListener('online',()=>{driveShowStatus();if(driveState.auto.pending)driveScheduleAuto(700)});
window.addEventListener('offline',driveShowStatus);
setInterval(driveShowStatus,30000);
(async()=>{await loadLocal();driveReadSettings();driveShowStatus();if(driveState.settings.clientId&&navigator.onLine&&location.protocol==='https:')driveLoadIdentity().catch(()=>{});listenLoad();readerLoad();render();loadLexicon();if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('Offline install unavailable',e))}if(!S.project.History.length&&S.project.Chapters.every(c=>c.Paragraphs.every(p=>!p.Text))){setTimeout(()=>toast('Welcome! Your writing saves on this device.'),650)}})();
})();

</script>
</body>
